<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BuyaLater</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #0B1438; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #cbd5f5; margin: 8px 0; }
    code { background: rgba(255,255,255,.12); padding: 2px 6px; border-radius: 6px; }
    button { margin-top: 16px; height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: #fff; color: #1E5FC7; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Tidak dapat terhubung</h1>
    <p>Pastikan server BuyaLater berjalan di laptop (<code>npm run dev</code>).</p>
    <p>Jika memakai kabel, jalankan <code>npm run usb:reverse</code> di laptop lalu tekan Coba Lagi.</p>
    <button onclick="location.href='/'">Coba Lagi</button>
  </main>
</body>
</html>
